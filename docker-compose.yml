version: '3.8'

services:
  api-gateway:
    build: ./services/api-gateway
    container_name: ecommerce-api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - ORDER_SERVICE_URL=http://order-service:5003
      - PAYMENT_SERVICE_URL=http://payment-service:5004
    depends_on:
      - auth-service
      - product-service
      - order-service
      - payment-service
    networks:
      - ecommerce-network

  auth-service:
    build: ./services/auth-service
    container_name: ecommerce-auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - JWT_SECRET=super_secret_jwt_key_change_in_production
    networks:
      - ecommerce-network

  product-service:
    build: ./services/product-service
    container_name: ecommerce-product-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    networks:
      - ecommerce-network

  order-service:
    build: ./services/order-service
    container_name: ecommerce-order-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - PAYMENT_SERVICE_URL=http://payment-service:5004
    depends_on:
      - product-service
      - payment-service
    networks:
      - ecommerce-network

  payment-service:
    build: ./services/payment-service
    container_name: ecommerce-payment-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
    networks:
      - ecommerce-network

  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
